<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="btn">
            <button
            (click)="theme.toggle()"
            [attr.aria-label]="'Passer en mode' + (theme.theme() === 'dark'?'clair':'sombre')"
            >
                {{theme.theme()}}
            </button>
        </div>
        <div class="mode"></div>
    </div>
</body>
</html>
