  <line x1="245" y1="130" x2="435" y2="130" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" opacity="0.6" style="fill:rgb(0, 0, 0);stroke:rgb(79, 70, 229);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Texte PaySim sous l'icône -->
  <text x="340" y="285" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="42" font-weight="800" fill="#1A1A2E" text-anchor="middle" style="fill:rgb(26, 26, 46);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Arial Rounded MT Bold&quot;, Arial, sans-serif;font-size:42px;font-weight:800;text-anchor:middle;dominant-baseline:auto">Pay<tspan fill="#4F46E5" style="fill:rgb(79, 70, 229);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Arial Rounded MT Bold&quot;, Arial, sans-serif;font-size:42px;font-weight:800;text-anchor:middle;dominant-baseline:auto">Sim</tspan></text>

  <!-- Tagline mini -->
  <text x="340" y="315" font-family="Arial, sans-serif" font-size="12" fill="#AAAAAA" letter-spacing="2" text-anchor="middle" style="fill:rgb(170, 170, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">SIMPLE INSTANT MONEY</text>
</svg>